<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1428">
  <meta name="description" content="Puppx Rampage - a tiny pixel-art arena survival game. Plays offline.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rampage">
  <title>Puppx Rampage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Puppx Rampage game"></canvas>
  <div id="safe"></div>
  <noscript><p class="nojs">Puppx Rampage needs JavaScript turned on.</p></noscript>
  <script src="js/font.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/content.js"></script>
  <script src="js/screens.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
